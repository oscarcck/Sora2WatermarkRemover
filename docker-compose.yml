version: '3.8'

services:
  jupyter:
    image: quay.io/jupyter/pytorch-notebook:cuda12-python-3.10
    container_name: sora2-watermark-remover
    ports:
      - "8888:8888"
    volumes:
      # Mount the entire project directory
      - .:/home/jovyan/work
      # Mount input/output directories (create these locally first)
      - ./input:/home/jovyan/work/input
      - ./output:/home/jovyan/work/output
      # Persist Jupyter configuration
      - jupyter-config:/home/jovyan/.jupyter
      # Persist model cache to avoid re-downloading
      - model-cache:/home/jovyan/.cache
    environment:
      # Jupyter configuration
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      # GPU settings
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Run as root initially to install system packages, then switch to jovyan
    user: root
    command: >
      bash -c "
      apt-get update && apt-get install -y ffmpeg &&
      chown -R jovyan:users /home/jovyan/work &&
      su jovyan -c 'start-notebook.sh --NotebookApp.token=\"\" --NotebookApp.password=\"\"'
      "

volumes:
  jupyter-config:
  model-cache:
