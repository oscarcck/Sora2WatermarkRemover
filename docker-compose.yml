version: '3.8'

services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: sora2-watermark-remover:latest
    container_name: sora2-watermark-remover
    ports:
      - "8888:8888"
    volumes:
      # Mount the entire project directory
      - .:/home/jovyan/work
      # Mount input/output directories (create these locally first)
      - ./input:/home/jovyan/work/input
      - ./output:/home/jovyan/work/output
      # Persist Jupyter configuration
      - jupyter-config:/home/jovyan/.jupyter
      # Persist model cache to avoid re-downloading
      - model-cache:/home/jovyan/.cache
    environment:
      # Jupyter configuration
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      # GPU settings
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  jupyter-config:
  model-cache:
